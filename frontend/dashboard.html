<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard - TaskFlow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Consolas', 'Courier New', monospace; }

  body {
    min-height: 100vh;
    background: #0a0a0a;
    color: #ff2d2d;
    padding: 30px 20px;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #330000;
    padding-bottom: 15px;
    margin-bottom: 25px;
  }

  .header h1 {
    font-size: 20px;
    color: #ff2d2d;
  }

  #logoutBtn {
    background: transparent;
    border: 1px solid #ff2d2d;
    color: #ff2d2d;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 12px;
    border-radius: 4px;
    cursor: pointer;
  }

  #logoutBtn:hover {
    background: #ff2d2d;
    color: #000;
  }

  .banner {
    background: #1a1a1a;
    border: 1px solid #ff2d2d;
    color: #fff;
    padding: 12px 16px;
    border-radius: 6px;
    margin-bottom: 20px;
    font-size: 13px;
    display: none;
  }

  .banner.show { display: block; }

  .add-task {
    background: #111;
    border: 1px solid #330000;
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 30px;
  }

  .add-task-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .add-task input, .add-task select {
    background: #000;
    border: 1px solid #330000;
    color: #fff;
    padding: 9px 10px;
    border-radius: 5px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
  }

  /* Themed calendar/time picker icon */
  input[type="datetime-local"]::-webkit-calendar-picker-indicator {
    filter: invert(27%) sepia(98%) saturate(3207%) hue-rotate(340deg) brightness(99%) contrast(97%);
    cursor: pointer;
    padding: 3px;
  }

  .add-task input#titleInput { flex: 2; min-width: 180px; }
  .add-task select { flex: 1; min-width: 110px; }
  .add-task input#dateInput { flex: 1.3; min-width: 190px; display: none; }

  .add-task button {
    background: #ff2d2d;
    color: #000;
    border: none;
    padding: 9px 18px;
    border-radius: 5px;
    font-family: inherit;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
  }

  .add-task button:hover { opacity: 0.85; }

  .columns {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  .column {
    flex: 1;
    min-width: 320px;
    background: #111;
    border: 1px solid #330000;
    border-radius: 8px;
    padding: 15px;
  }

  .column h2 {
    font-size: 14px;
    color: #ff2d2d;
    margin-bottom: 15px;
    padding-bottom: 8px;
    border-bottom: 1px solid #330000;
  }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: #000;
    border: 1px solid #330000;
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 10px;
  }

  .tick {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border: 1px solid #ff2d2d;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: #ff2d2d;
    margin-top: 2px;
  }

  .task.completed .tick {
    background: #ff2d2d;
    color: #000;
  }

  .task-content {
    flex: 1;
  }

  .task-title {
    color: #fff;
    font-size: 14px;
    margin-bottom: 4px;
  }

  .task.completed .task-title {
    text-decoration: line-through;
    color: #666;
  }

  .task-date {
    font-size: 11px;
    color: #ff5f56;
  }

  .deleteBtn {
    background: transparent;
    border: none;
    color: #555;
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
  }

  .deleteBtn:hover { color: #ff2d2d; }

  .empty {
    color: #555;
    font-size: 13px;
    text-align: center;
    padding: 20px 0;
  }
</style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>TASKFLOW</h1>
      <button id="logoutBtn">Logout</button>
    </div>

    <div class="banner" id="weekendBanner"></div>

    <div class="add-task">
      <div class="add-task-row">
        <input type="text" id="titleInput" placeholder="Task title...">
        <select id="categoryInput">
          <option value="todo">To-Do</option>
          <option value="reminder">Reminder</option>
        </select>
        <input type="datetime-local" id="dateInput">
        <button id="addBtn">+ Add</button>
      </div>
    </div>

    <div class="columns">
      <div class="column">
        <h2>&gt; TO-DO</h2>
        <div id="todoList"></div>
      </div>
      <div class="column">
        <h2>&gt; REMINDERS</h2>
        <div id="reminderList"></div>
      </div>
    </div>
  </div>

  <script>
    const categoryInput = document.getElementById('categoryInput');
    const dateInput = document.getElementById('dateInput');
    const titleInput = document.getElementById('titleInput');
    const addBtn = document.getElementById('addBtn');
    const todoList = document.getElementById('todoList');
    const reminderList = document.getElementById('reminderList');
    const logoutBtn = document.getElementById('logoutBtn');
    const weekendBanner = document.getElementById('weekendBanner');
    // Ask permission for desktop notifications
if ('Notification' in window && Notification.permission === 'default') {
  Notification.requestPermission();
}

    // Day-based banner messages
    const now = new Date();
    const day = now.getDay(); // 0 = Sunday, 1 = Monday, 5 = Friday, 6 = Saturday

    const mondayQuotes = [
      "💪 New week, new leetcode problems to fake-solve. Let's go.",
      "🔥 Monday says: small steps today, big flex Friday.",
      "🚀 Reboot complete. System optimism: 100%.",
      "☕ Monday fuel loaded. Tasks don't stand a chance."
    ];

    if (day === 5) {
      weekendBanner.textContent = "🎉 It's Friday! Happy Weekend, almost.";
      weekendBanner.classList.add('show');
    } else if (day === 6 || day === 0) {
      weekendBanner.textContent = "😏 Still working on a " + (day === 6 ? "Saturday" : "Sunday") + "? Go touch some grass. 🌿";
      weekendBanner.classList.add('show');
    } else if (day === 1) {
      const quote = mondayQuotes[Math.floor(Math.random() * mondayQuotes.length)];
      weekendBanner.textContent = quote;
      weekendBanner.classList.add('show');
    }

    categoryInput.addEventListener('change', () => {
      dateInput.style.display = categoryInput.value === 'reminder' ? 'block' : 'none';
    });

    async function loadTasks() {
      try {
        const res = await fetch('/api/tasks');
        if (res.status === 401) {
          window.location.href = 'login.html';
          return;
        }
        const tasks = await res.json();
        renderTasks(tasks);
      } catch (err) {
        console.error(err);
      }
    }

    function renderTasks(tasks) {
      todoList.innerHTML = '';
      reminderList.innerHTML = '';

      const todos = tasks.filter(t => t.category === 'todo');
      const reminders = tasks.filter(t => t.category === 'reminder');

      if (todos.length === 0) todoList.innerHTML = '<div class="empty">No to-dos yet.</div>';
      if (reminders.length === 0) reminderList.innerHTML = '<div class="empty">No reminders yet.</div>';

      todos.forEach(task => todoList.appendChild(createTaskEl(task)));
      reminders.forEach(task => reminderList.appendChild(createTaskEl(task)));
    }

    function createTaskEl(task) {
      const div = document.createElement('div');
      div.className = 'task' + (task.status === 'completed' ? ' completed' : '');

      const dateHTML = task.dueDate
        ? `<div class="task-date">${new Date(task.dueDate).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}</div>`
        : '';

      div.innerHTML = `
        <div class="tick">${task.status === 'completed' ? '✓' : ''}</div>
        <div class="task-content">
          <div class="task-title">${task.title}</div>
          ${dateHTML}
        </div>
        <button class="deleteBtn">×</button>
      `;

      div.querySelector('.tick').addEventListener('click', () => toggleTask(task));
      div.querySelector('.deleteBtn').addEventListener('click', () => deleteTask(task._id));

      return div;
    }

    async function toggleTask(task) {
      const newStatus = task.status === 'completed' ? 'pending' : 'completed';
      await fetch(`/api/tasks/${task._id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });
      loadTasks();
    }

    async function deleteTask(id) {
      await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
      loadTasks();
    }

    addBtn.addEventListener('click', async () => {
      const title = titleInput.value.trim();
      const category = categoryInput.value;
      const dueDate = dateInput.value;

      if (!title) return;
      if (category === 'reminder' && !dueDate) {
        alert('Reminders need a date and time.');
        return;
      }

      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, category, dueDate: dueDate || undefined })
      });

      titleInput.value = '';
      dateInput.value = '';
      loadTasks();
    });

    logoutBtn.addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = 'login.html';
    });

    loadTasks();
    // Level 1: In-tab reminder notifications
const alertedTasks = new Set();

async function checkDueReminders() {
  try {
    const res = await fetch('/api/tasks');
    if (res.status === 401) return;
    const tasks = await res.json();

    const now = new Date();

    tasks.forEach(task => {
      if (
        task.category === 'reminder' &&
        task.status !== 'completed' &&
        task.dueDate &&
        !alertedTasks.has(task._id)
      ) {
        const due = new Date(task.dueDate);
        if (due <= now) {
          showReminderAlert(task.title);
          alertedTasks.add(task._id);
        }
      }
    });
  } catch (err) {
    console.error(err);
  }
}

function showReminderAlert(title) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title);
  }
}

// Check every 30 seconds
setInterval(checkDueReminders, 30000);
checkDueReminders(); // also check immediately on load
  </script>

</body>
</html>
