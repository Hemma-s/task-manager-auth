<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - TaskFlow</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Consolas', 'Courier New', monospace; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    color: #ff2d2d;
  }

  .terminal {
    width: 480px;
    background: #111;
    border: 1px solid #ff2d2d;
    border-radius: 8px;
    box-shadow: 0 0 25px rgba(255, 45, 45, 0.35);
    overflow: hidden;
  }

  .terminal-header {
    background: #1a1a1a;
    padding: 10px 15px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid #330000;
  }

  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.red { background: #ff5f56; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green { background: #27c93f; }

  .terminal-title {
    margin-left: 10px;
    font-size: 12px;
    color: #888;
  }

  .terminal-body {
    padding: 25px 20px;
    min-height: 280px;
    font-size: 15px;
    line-height: 1.8;
  }

  .line { margin-bottom: 10px; }

  .prompt { color: #ff2d2d; }

  #inputLine {
    display: flex;
    align-items: center;
  }

  #userInput {
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 15px;
    flex: 1;
    caret-color: #ff2d2d;
  }

  #userInput[type="password"] {
    letter-spacing: 3px;
  }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 16px;
    background: #ff2d2d;
    animation: blink 1s step-end infinite;
    margin-left: 4px;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .footer-text {
    text-align: center;
    padding: 15px;
    font-size: 12px;
    color: #666;
    border-top: 1px solid #330000;
  }

  .footer-text a {
    color: #ff2d2d;
    text-decoration: none;
  }
</style>
</head>
<body>

  <div class="terminal">
    <div class="terminal-header">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <span class="terminal-title">taskflow — login</span>
    </div>

    <div class="terminal-body" id="terminalBody">
      <div class="line">&gt; SYSTEM READY.</div>
      <div class="line">&gt; Authentication required.</div>
      <div class="line" id="questionLine"></div>
      <div id="inputLine">
        <span class="prompt">&gt;&nbsp;</span>
        <input type="text" id="userInput" autocomplete="off" autofocus>
        <span class="cursor"></span>
      </div>
    </div>

    <p class="footer-text">New here? <a href="signup.html">Create an account</a></p>
  </div>

  <script>
    const questionLine = document.getElementById('questionLine');
    const userInput = document.getElementById('userInput');
    const terminalBody = document.getElementById('terminalBody');

    let stage = 0;
    let username = '';
    let password = '';

    function typeQuestion(text) {
      questionLine.textContent = '> ' + text;
    }

    typeQuestion('Enter username:');

    userInput.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter') {
        const value = userInput.value.trim();
        if (!value) return;

        if (stage === 0) {
          username = value;
          appendLine('> ' + value);
          userInput.value = '';
          userInput.type = 'password';
          stage = 1;
          typeQuestion('Enter password:');
        } else if (stage === 1) {
          password = value;
          appendLine('> ' + '*'.repeat(value.length));
          userInput.value = '';
          userInput.disabled = true;
          typeQuestion('Verifying...');

          try {
            const res = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (res.ok) {
              typeQuestion('ACCESS GRANTED. Welcome, ' + data.user + '.');
              appendLine('> Redirecting to dashboard...');
              setTimeout(() => window.location.href = 'dashboard.html', 1500);
            } else {
              typeQuestion('ACCESS DENIED. Invalid credentials.');
              appendLine('> Refresh the page to try again.');
            }
          } catch (err) {
            typeQuestion('ERROR: Connection to server failed.');
          }
        }
      }
    });

    function appendLine(text) {
      const div = document.createElement('div');
      div.className = 'line';
      div.textContent = text;
      terminalBody.insertBefore(div, questionLine);
    }
  </script>

</body>
</html>
